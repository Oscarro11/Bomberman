name: C++ SFML CI (Linux)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
        compiler: [gcc, clang]

        include:
          - compiler: gcc
            c_compiler: gcc
            cpp_compiler: g++

          - compiler: clang
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Install dependencies
      # -------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsfml-dev \
            cmake \
            ninja-build \
            gcc g++ \
            clang

      # -------------------------
      # Configure (CMake)
      # -------------------------
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      # -------------------------
      # Build
      # -------------------------
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      # -------------------------
      # Test (headless SFML-safe)
      # -------------------------
      - name: Run tests
        run: |
          sudo apt-get install -y xvfb
          xvfb-run ctest --test-dir build --output-on-failure